# ==========================================================
# HQFSF Pytest Configuration
# ==========================================================

[pytest]

# ----------------------------------------------------------
# Test Discovery
# ----------------------------------------------------------

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

# ----------------------------------------------------------
# Output
# ----------------------------------------------------------

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# ----------------------------------------------------------
# Markers
# ----------------------------------------------------------

markers =
    unit: Unit tests
    integration: Integration tests
    quantum: Quantum module tests
    classical: Classical module tests
    pipeline: Pipeline tests
    slow: Slow-running tests

# ----------------------------------------------------------
# Warnings
# ----------------------------------------------------------

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------

log_cli = true

log_cli_level = INFO

log_cli_format = %(asctime)s | %(levelname)s | %(message)s

log_cli_date_format = %Y-%m-%d %H:%M:%S

# ----------------------------------------------------------
# Minimum Version
# ----------------------------------------------------------

minversion = 8.0