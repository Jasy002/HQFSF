# ==========================================================
# HQFSF Machine Learning Model Configuration
# ==========================================================

# Default model used by the HQFSF pipeline
default_model: random_forest

# ==========================================================
# Supported Models
# ==========================================================

supported_models:

  - random_forest

  - svm

  - logistic_regression

  - xgboost

# ==========================================================
# Random Forest
# ==========================================================

random_forest:

  enabled: true

  n_estimators: 100

  criterion: gini

  max_depth: null

  min_samples_split: 2

  min_samples_leaf: 1

  max_features: sqrt

  bootstrap: true

  random_state: 42

  n_jobs: -1

# ==========================================================
# Support Vector Machine
# ==========================================================

svm:

  enabled: true

  kernel: rbf

  C: 1.0

  gamma: scale

  degree: 3

  probability: true

  random_state: 42

# ==========================================================
# Logistic Regression
# ==========================================================

logistic_regression:

  enabled: true

  penalty: l2

  C: 1.0

  solver: lbfgs

  max_iter: 1000

  random_state: 42

# ==========================================================
# XGBoost
# ==========================================================

xgboost:

  enabled: true

  n_estimators: 100

  learning_rate: 0.10

  max_depth: 6

  min_child_weight: 1

  subsample: 1.0

  colsample_bytree: 1.0

  objective: binary:logistic

  eval_metric: logloss

  random_state: 42

# ==========================================================
# Training
# ==========================================================

training:

  cross_validation:

    enabled: true

    folds: 5

  early_stopping:

    enabled: false

    rounds: 20

# ==========================================================
# Prediction
# ==========================================================

prediction:

  probability: true

  batch_size: 128

# ==========================================================
# Model Persistence
# ==========================================================

saving:

  save_model: true

  model_directory: "./saved_models"

  format: joblib

# ==========================================================
# End
# ==========================================================