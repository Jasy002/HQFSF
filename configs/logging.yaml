# ==========================================================
# HQFSF Logging Configuration
# ==========================================================

version: 1

disable_existing_loggers: false

# ==========================================================
# Formatters
# ==========================================================

formatters:

  standard:

    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:

    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s"

    datefmt: "%Y-%m-%d %H:%M:%S"

# ==========================================================
# Handlers
# ==========================================================

handlers:

  console:

    class: logging.StreamHandler

    level: INFO

    formatter: standard

    stream: ext://sys.stdout

  file:

    class: logging.handlers.RotatingFileHandler

    level: INFO

    formatter: detailed

    filename: logs/hqfsf.log

    maxBytes: 5242880      # 5 MB

    backupCount: 5

    encoding: utf-8

# ==========================================================
# Loggers
# ==========================================================

loggers:

  HQFSF:

    level: INFO

    handlers:

      - console

      - file

    propagate: false

# ==========================================================
# Root Logger
# ==========================================================

root:

  level: INFO

  handlers:

    - console

    - file

# ==========================================================
# Logging Options
# ==========================================================

settings:

  create_log_directory: true

  overwrite_log_file: false

  log_to_console: true

  log_to_file: true

# ==========================================================
# End
# ==========================================================