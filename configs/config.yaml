# ==========================================================
# HQFSF Configuration File
# ==========================================================

project:
  name: "Hybrid Quantum Feature Selection Framework"
  short_name: "HQFSF"
  version: "1.0.0"

author:
  name: "Jasmine Sultana"
  university: "Vidyasagar University"
  department: "Department of Computer Science"
  research: "Hybrid Quantum Feature Selection Framework Using Variational Quantum Circuits"

# ==========================================================
# Experiment
# ==========================================================

experiment:

  experiment_name: "HQFSF_Experiment_01"

  random_seed: 42

  test_size: 0.20

  validation_size: 0.10

  shuffle: true

# ==========================================================
# Directories
# ==========================================================

paths:

  dataset: "./datasets"

  models: "./saved_models"

  outputs: "./outputs"

  results: "./results"

  plots: "./plots"

  logs: "./logs"

# ==========================================================
# Runtime
# ==========================================================

runtime:

  device: "cpu"

  workers: 4

  save_models: true

  save_plots: true

  save_logs: true

# ==========================================================
# Feature Selection
# ==========================================================

feature_selection:

  method: "HQFSF"

  top_k: 5

  ranking: "expectation"

# ==========================================================
# Evaluation
# ==========================================================

evaluation:

  metrics:

    - accuracy

    - precision

    - recall

    - f1_score

    - roc_auc

    - confusion_matrix

# ==========================================================
# Reproducibility
# ==========================================================

reproducibility:

  deterministic: true

  random_seed: 42

# ==========================================================
# Visualization
# ==========================================================

visualization:

  figure_dpi: 300

  style: "default"

  save_format: "png"

# ==========================================================
# End
# ==========================================================